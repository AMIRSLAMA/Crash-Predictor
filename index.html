<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Crash Predictor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 45%,#25212a 0,#0d0d14 55%,#050609 100%);color:#fff;font-family:Arial,sans-serif}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden}
#simpleApp{width:min(88vw,390px);aspect-ratio:1;border:2px solid #d9aa43;border-radius:50%;background:radial-gradient(circle,#1c1c25 0,#101117 70%,#090a0f 100%);box-shadow:0 0 0 9px #d8a63812,0 0 55px #d8a63826,inset 0 0 45px #d8a63812;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:25px;padding:24px}
#simplePercent{font-size:clamp(68px,17vw,100px);font-weight:900;line-height:1;color:#ffd15a;letter-spacing:-4px;text-shadow:0 0 22px #ffc43d60;direction:ltr}
#simplePercent small{font-size:.42em;letter-spacing:0}
#nextRound{width:154px;height:154px;border-radius:50%;border:2px solid #ffe18a;background:linear-gradient(145deg,#ffe16c,#ffad13 65%,#e88700);box-shadow:0 0 0 7px #f5b52b16,0 8px 28px #ff9b1c38;color:#171006;font:900 20px Arial;cursor:pointer;display:grid;place-items:center;padding:16px;line-height:1.5}
#nextRound:disabled{opacity:.8;cursor:wait}
#simpleStatus{position:fixed;bottom:12px;max-width:90vw;text-align:center;color:#a9a19a;font:12px Arial}
#legacyTools{display:none!important}
@media(max-width:420px){#simpleApp{width:88vw;gap:18px;padding:18px}#nextRound{width:138px;height:138px;font-size:18px}}
</style>
</head>
<body>
<main id="simpleApp" aria-label="Crash Predictor">
<div id="simplePercent">--<small>%</small></div>
<button id="nextRound" type="button">الجولة التالية</button>
</main>
<div id="simpleStatus" aria-live="polite">جارٍ تحميل سجل النتائج…</div>
<div id="legacyTools" aria-hidden="true">
<input id="historyInput"><button id="toggleHistory"></button><div id="historyPanel" class="hidden"></div><button id="sampleHistory"></button><button id="saveHistory"></button><span id="historyMessage"></span>
<span id="multiplier">--</span><span id="status"></span><span id="autoThreshold"></span><span id="subnote"></span>
<span id="collectorCount"></span><div id="collectorSaved"></div>
<textarea id="decoderInput"></textarea><div id="decoderResults"></div><span id="decoderStatus"></span><button id="decodeMessages"></button><button id="clearDecoder"></button><button id="exportJson"></button><button id="exportCsv"></button><button id="clearCollected"></button>
<button id="labAnalyze"></button><div id="labOutput"></div><input id="labActual"><button id="labSettle"></button><div id="labScore"></div><button id="labClear"></button><div id="labHistory"></div>
</div>
<script src="analytics.js?v=20261116-4"></script><script src="decoder.js?v=20261116-4"></script><script src="collector.js?v=20261116-4"></script><script src="app.js?v=20261116-4"></script><script src="live-lab.js?v=20261116-4"></script>
<script>
(()=>{const display=document.getElementById('simplePercent'),status=document.getElementById('simpleStatus'),button=document.getElementById('nextRound');const sync=()=>{display.innerHTML=document.getElementById('multiplier').innerHTML;const s=document.getElementById('status').textContent;status.textContent=s||'اضغط الجولة التالية لحساب النسبة';};const observer=new MutationObserver(sync);observer.observe(document.getElementById('multiplier'),{childList:true,subtree:true,characterData:true});observer.observe(document.getElementById('status'),{childList:true,subtree:true,characterData:true});button.addEventListener('click',()=>{status.textContent='جارٍ حساب النسبة…';setTimeout(sync,80);setTimeout(sync,500);});window.addEventListener('load',()=>{setTimeout(sync,400);setTimeout(sync,1500);});})();
</script>
</body></html>

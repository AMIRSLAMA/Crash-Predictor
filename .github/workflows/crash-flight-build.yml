name: CRASH FLIGHT Windows build

on:
  pull_request:
    paths:
      - "crash-flight/**"
      - ".github/workflows/crash-flight-build.yml"
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crash-flight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crash-flight/package.json
      - name: Install dependencies
        run: npm install
      - name: Run parser tests
        run: npm test
      - name: Build portable Windows app
        run: npm run build:win
      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: CRASH-FLIGHT-Windows
          path: crash-flight/dist/*.exe
          if-no-files-found: error

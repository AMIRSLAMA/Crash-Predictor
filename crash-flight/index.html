<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRASH FLIGHT</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Tahoma,sans-serif;background:#070b14;color:#edf4ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#18365c 0,transparent 55%),#070b14}
header{padding:14px 20px;border-bottom:1px solid #22324a;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;letter-spacing:2px;font-size:18px;color:#e8c66a}header small{display:none}
main{padding:18px;max-width:none;margin:0;min-height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center}
#patternPanel{width:min(760px,100%);min-height:55vh;background:linear-gradient(145deg,#101e32,#0b1220);border:1px solid #29415f;border-radius:24px;padding:clamp(22px,5vw,54px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 20px 80px #0006}
#patternPanel h2{margin:0 0 26px;font-size:clamp(22px,4vw,32px);color:#e8c66a}
#proximity{font-size:clamp(22px,4.4vw,38px)!important;font-weight:800!important;color:#91a4bd;line-height:1.5}
#proximityMeta{margin:18px 0 0;font-size:15px;color:#91a4bd;line-height:1.9}
#connectionStatus{margin:28px 0 0;font-size:13px;color:#75d6a0}
button{border:0;border-radius:9px;padding:10px 14px;background:#e8c66a;color:#101522;font-weight:700;cursor:pointer}
#exportEvents{display:none!important}
.stats,.hero,.row,.panel:not(#patternPanel),footer{display:none!important}
#openGame{font-size:13px;padding:9px 12px}
#planeState,.plane{display:none!important}
@media(max-width:600px){header{padding:12px}h1{font-size:16px}main{padding:12px}#patternPanel{min-height:62vh;border-radius:18px}}
</style>
</head>
<body>
<header><h1>✈ CRASH FLIGHT</h1><button id="openGame">فتح اللعبة</button><button id="exportEvents">تصدير</button></header>
<main>
<section id="patternPanel" class="panel">
<h2>نمط الجولة</h2>
<div id="proximity">في انتظار بيانات الجولة</div>
<p id="proximityMeta">يتم عرض حالة النمط التجريبي فقط. لا يمكن اعتبارها توقعًا لنتيجة الجولة.</p>
<p id="connectionStatus">حالة الربط: لم يتم فتح نافذة اللعبة</p>
</section>
<div class="hero"><div id="planeState">—</div><div class="plane">✈</div></div>
<section class="stats">
<div class="stat"><span>اتصالات</span><strong id="connections">0</strong></div><div class="stat"><span>Frames</span><strong id="frames">0</strong></div><div class="stat"><span>Events</span><strong id="events">0</strong></div><div class="stat"><span>Rounds</span><strong id="saved">0</strong></div></section>
<section class="row"><div class="panel"><h3>Historical</h3><div id="nextEstimate">—</div><p id="estimateMeta">—</p></div></section>
<section class="panel"><p id="messageCount">0</p><table><tbody id="messageLog"></tbody></table></section>
<section class="row"><div class="panel"><p id="roundState">—</p><p id="roundTimer">—</p><p id="lastEvent">—</p><p id="lastActivity">—</p></div><div class="panel"></div></section>
<section class="panel"><table><tbody id="rounds"></tbody></table></section>
</main>
<footer>—</footer>
<script src="renderer.js"></script>
</body>
</html>
